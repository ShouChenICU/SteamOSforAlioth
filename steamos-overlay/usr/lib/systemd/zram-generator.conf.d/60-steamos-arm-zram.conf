# Bigger, better compressed swap for games. The stock zram0 is half of RAM
# with lzo-rle; zstd fits a lot more into the same memory, and sizing it to
# RAM (capped at 8 GB) gives heavy games room before they run out. The size
# is only a ceiling, zram only uses memory for what it actually stores.
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
