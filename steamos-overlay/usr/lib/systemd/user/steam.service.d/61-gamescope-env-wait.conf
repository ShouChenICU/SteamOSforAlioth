# gamescope-session's After=/BindsTo= ordering doesn't reliably prevent
# steam.service starting before gamescope-session has written
# %t/gamescope-steam.env (measured live: steam.service ActiveEnterTimestamp
# a full second before the file's own mtime, every boot, no restarts of
# either unit involved). EnvironmentFile=-%t/gamescope-steam.env
# (60-gamescope-env.conf) then silently loads nothing, and Steam never
# restarts to pick it up later, so STEAM_USE_MANGOAPP / MANGOHUD_CONFIGFILE
# / the refresh-rate slider stay off for the whole session.
# Wait up to 5s (gamescope-session.service's own TimeoutStartSec) for the
# file to exist before Steam starts; give up and proceed either way so a
# slow/failed gamescope-session can't hang Steam forever.
[Service]
ExecStartPre=/bin/bash -c 'for i in $(seq 1 50); do [[ -s "%t/gamescope-steam.env" ]] && exit 0; sleep 0.1; done; exit 0'
