# The pulse server takes its limits from pulse.properties, not
# context.properties: without these a PulseAudio client (most games through
# SDL, Steam itself) could still request 5 ms fragments and drag the graph
# below the floor set in pipewire.conf.d/99-sm8550-buffers.conf.
pulse.properties = {
    pulse.min.req     = 1024/48000
    pulse.min.frag    = 1024/48000
    pulse.min.quantum = 1024/48000
}
