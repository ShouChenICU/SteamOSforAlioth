# Windows games (Wine/Proton) can't change the device volume, only their own.
# GTA IV mutes itself when it loses focus (Steam overlay opened), Proton turned
# that into the speaker volume going to 0, and when the game froze the device
# stayed silent until a volume key press (Pocket FIT). Steam and the volume
# keys still set the device volume as before.
pulse.rules = [
  {
    matches = [
      { application.process.binary = "~wine.*" }
      { application.process.binary = "~.*[.]exe" }
      { application.name = "~.*[.]exe" }
    ]
    actions = {
      quirks = [ block-sink-volume block-source-volume ]
    }
  }
]
