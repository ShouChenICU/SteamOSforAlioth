# Audio buffer floor for every chip. The DSP path (q6apm) underruns when a
# game asks PipeWire for a very small quantum, which is heard as crackles
# and pops. 1024 frames (21 ms at 48 kHz) is what the Pocket FIT has run
# glitch-free with; games and video don't notice the latency.
context.properties = {
    default.clock.min-quantum = 1024
}
