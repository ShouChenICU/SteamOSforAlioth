<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- steamos-arm-power: Steam's power controls, relayed by steamos-manager. -->
<busconfig>
  <policy user="root">
    <allow own="org.steamos_arm.Power"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.steamos_arm.Power"/>
  </policy>
</busconfig>
