# First-boot speaker volume. The Frame's 50-alsa-config.conf gives every
# built-in card 0.6, which Steam's cubic volume bar shows as ~85-100%, loud
# on a fresh flash. 0.25^3 = 25% on Steam's bar. Only used until the user
# changes the volume; WirePlumber remembers it after that.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-*" }
    ]
    actions = {
      update-props = {
        device.routes.default-sink-volume = 0.015625
      }
    }
  }
]
