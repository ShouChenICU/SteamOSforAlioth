# Give timesyncd servers it can actually reach.
#
# The Frame image ships /etc/systemd/timesyncd.conf with every entry in
# [Time] commented out, so timesyncd falls back to the arch pool that was
# compiled in. Measured on the device 2026-10-24, right after it joined
# Wi-Fi: not one of 0.arch.pool.ntp.org, pool.ntp.org, time.cloudflare.com
# or time.google.com resolved on that network, timesyncd sat at "Idle."
# without ever sending a packet, and `timedatectl` said
# "System clock synchronized: no". DHCP was no help either -- the lease
# asked for ntp_servers and came back without any.
#
# This is not the same problem as usr/lib/clock-epoch, and neither one
# covers the other. clock-epoch only guarantees the clock is not *earlier*
# than the build date, which is what stops PAM's "password changed in
# future" and "certificate not yet valid". It does nothing about a clock
# that is late or drifting, and the device was measured a full day behind.
# Steam Guard and certificates close to expiry both care.
#
# NTP= rather than FallbackNTP=: the fallback list is only consulted when
# NTP= is empty *and* the compile-time default is empty too, and this
# image's compile-time default is not empty -- a FallbackNTP= here would
# never be reached.
#
# Order is deliberate: the globally correct names first, then names that
# resolve inside mainland China. timesyncd walks the list in order and
# skips what it cannot resolve, so one file works on either side.
[Time]
NTP=2.pool.ntp.org time.cloudflare.com cn.pool.ntp.org ntp.aliyun.com
