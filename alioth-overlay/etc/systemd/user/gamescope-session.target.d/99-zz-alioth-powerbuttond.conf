[Unit]
# The Frame's own power-button unit depends on SteamVR, which is not running
# here, so the session must pull in steamos-powerbuttond instead.
#
# The "zz" is load-bearing: systemd merges drop-ins in filename order, and
# steamos-overlay's 99-odin.conf carries an empty `Wants=` that resets the
# Frame's steamvr dependencies. A drop-in sorting before it has its Wants=
# wiped, silently -- the symptom is a power button that does nothing in Game
# Mode. Under the old name (99-alioth-...) that happened, and only
# sm8250-overlay's 99-sm8250-powerbuttond.conf, which does sort after,
# covered for it. Asserted by scripts/assert-alioth-overlay.py.
Wants=steamos-powerbuttond.service
