# 关掉空间音频之后必须同时换权限管理器，否则**所有应用都没有声音**，而且不报
# 任何错。
#
# Frame 的 /etc/wireplumber/wireplumber.conf.d/10-access.conf 定义了三个权限
# 管理器。给普通应用（access = "default"）用的那个叫 steamos-default，它的
# default_permissions 是 "all"，但规则里对一串节点执行 set-permissions = ""
# —— 剥夺全部权限 —— 而那串节点里逐字写着：
#
#   { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
#
# 这正是这台手机 sink 的节点名。又一次撞名：名字由总线路径（platform-sound，
# 和 Frame 一样）加 UCM 的 verb 与 device（HiFi / Speaker，来自
# usr/share/alsa/ucm2/Xiaomi/Alioth）拼出来，两边逐字相同 ——
# 75-alioth-no-frame-scripts.conf 里的 microphone-tracker 撞的也是这一个。
#
# 在 Frame 上这条规则是故意的：把裸 ALSA sink 对应用藏起来，强迫它们走空间
# 音频的 filter chain。而这台机器上 filter chain 不存在（vraudiocompositor.so
# 这个 rootfs 不带，见 75-alioth-no-frame-scripts.conf），于是应用既看不见裸
# sink、也没有 filter chain 可连 —— 什么都链接不到。
#
# 症状离原因极远，值得把它写清楚：声卡在、sink 在、路由开着、UCM 的增益也都
# 生效了，PCM 却从来不打开。应用拿到的权限是 `any=rwxm-`（WirePlumber 自己是
# `rwxml`），缺的就是 l —— link。PipeWire 的 impl-link.c 里 check_permission()
# 要求节点的所属客户端看得见对方节点，看不见就是：
#
#   link-factory: can't link ports 60 and 65: Operation not permitted
#   wp-event-dispatcher: link failed: 2 of 2 PipeWire links failed to activate
#
# 而且 PipeWire 的 module-access 文档写明：access 不是 "unrestricted" 的客户端
# 一开始**什么权限都没有**，要等会话管理器来发。所以这件事完全取决于选中了
# 哪个权限管理器。
#
# Valve 已经为「没有空间音频」准备了一个：steamos-default-nospatial。它的
# default_permissions 同样是 "all"，但剥夺列表里只有 filter chain 那几个节点，
# **没有**我们的 sink。关空间音频和换这个管理器是一件事的两半，我之前只做了
# 一半。
#
# 编号比 10- 大，同一个目录，所以这条规则后匹配、后生效。
access.rules = [
  {
    matches = [
      {
        access = "default"
      }
    ]
    actions = {
      update-props = {
        permission_manager_name = "steamos-default-nospatial"
      }
    }
  }
]
