# Xiaomi alioth: use ACP (so our UCM is read at all), and give this PCM a
# period size it can actually take.
#
# Without this there is no sink. `wpctl status` shows only "Dummy Output"
# and every application plays into it; the log says
#
#   s-monitors: Failed to create ALSA node alsa_output.platform-sound.playback.0.0:
#               Object activation aborted: PipeWire proxy destroyed
#   s-monitors: Failed to create ALSA node alsa_input.platform-sound.capture.0.0: ...
#   wireplumber.service: Main process exited, code=dumped, status=11/SEGV
#
# and nothing anywhere names a period size, a sample format or UCM.
#
# Two separate things are wrong without it:
#
#   api.alsa.use-acp.  The Frame's own 50-alsa-config.conf turns ACP off.
#   ACP is the half of the ALSA monitor that reads UCM; with it off,
#   WirePlumber ignores usr/share/alsa/ucm2/Xiaomi/Alioth entirely and
#   enumerates raw PCM subdevices instead -- which is how it ends up trying
#   to build `alsa_input.platform-sound.capture.0.0` on a card that has no
#   capture PCM at all (`aplay -l` lists exactly one device, playback
#   MultiMedia1). The giveaway is the node names: the raw form is
#   alsa_{output,input}.<bus>.<playback|capture>.<card>.<dev>, while a
#   UCM-derived node is named after the UCM device. With ACP off, the UCM's
#   EnableSequence never runs either, so `TERT_TDM_RX_0 Audio Mixer
#   MultiMedia1` stays 0 and even a sink that did appear would be mute.
#   The SM8550 overlay (52-sm8550-alsa.conf) turns ACP back on for the same
#   reason.
#
#   period-size.  50-alsa-config.conf asks for 256 frames. This PCM will not
#   go below 480: sm8250_be_hw_params_fixup() pins the backend at 48 kHz
#   stereo and `aplay --dump-hw-params hw:0,0` reports
#   PERIOD_SIZE: [480 3360], PERIODS: [2 8]. 1440/4 is what speaker-test
#   negotiates on its own, so it is known to work end to end here.
#
# audio.format is set because UCM has keys for the rate and the channel
# count (PlaybackRate, PlaybackChannels in Xiaomi/Alioth/HiFi.conf) but none
# for the sample format, and the kernel fixes these backends at S16LE.
#
# Why /etc and not /usr/share: WirePlumber merges conf.d fragments from
# /usr/share first and /etc after, so a /usr/share fragment loses to the
# Frame's /etc/wireplumber/wireplumber.conf.d/50-alsa-config.conf no matter
# what it is called. 76- sorts after every fragment Valve ships (50, 51, 60,
# 70) and after our own 75-alioth-no-spatial.conf.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.acp.disable-pro-audio = false
        api.acp.auto-profile = false
        api.acp.auto-port = false
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = "FL,FR"
        api.alsa.period-size = 1440
        api.alsa.headroom = 1440
      }
    }
  }
]
