# 两个 Frame 专属的 wireplumber 脚本在这台手机上都会把 wireplumber 搞崩，
# 都是以 SIGSEGV 的形式，而且都和「少了什么功能」无关 —— 后果都是整个
# 会话管理器起不来，于是唯一的 sink 是 "Dummy Output"。
#
# steamos.spatial-node-config 是第一个：
# Frame is a VR headset: /etc/wireplumber/wireplumber.conf.d/
# 70-spatial-node-config.conf loads /etc/wireplumber/scripts/
# spatial-node-config.lua, which pulls in /usr/lib/ladspa/
# vraudiocompositor.so -- a plugin this rootfs does not ship.
#
# The script is declared "required" in the main profile, so the missing
# plugin takes wireplumber down with SIGSEGV on every single start. Measured
# on alioth 2026-10-23: a crash loop with a fresh PID every one to two
# seconds, and
#   vraudio-loader: Failed to open vraudiocompositor.so: ... No such file
# right before each one. The symptom is not a missing spatial effect, it is
# **no audio at all**: the only sink is "Dummy Output".
#
# steamos.microphone-tracker is the second one, and it is the subtler of
# the two. /etc/wireplumber/scripts/microphone-tracker.lua (declared
# "required" by 40-mic-processing.conf) opens with
#
#   local BUILTIN_SOURCE_NAME = "alsa_input.platform-sound.HiFi__Mic__source"
#   local BUILTIN_SINK_NAME   = "alsa_output.platform-sound.HiFi__Speaker__sink"
#
# and the sink name is **exactly** what this phone produces: the node name is
# built from the bus path (platform-sound, same as the Frame) and the UCM
# verb and device (HiFi / Speaker, from usr/share/alsa/ucm2/Xiaomi/Alioth).
# So the script engages as if it were running on a Frame, and then works with
# the mic half -- the source above and the loopback it derives from it --
# which does not exist here: this DTS disables &vamacro and &lpass_tlmm, and
# `aplay -l` lists exactly one PCM, playback only. It dies with SIGSEGV.
#
# Measured on alioth 2026-10-24: wireplumber crashed five times at every boot
# and ended in `failed`. `WIREPLUMBER_DEBUG=3 wireplumber` showed how far it
# got -- the route ([Out] Speaker) was found, the sink was created and made
# default.audio.sink -- and then the core dump, with nothing in between
# naming a cause. Without this entry the whole ACP/UCM path above is wasted:
# the sink appears and then the session manager dies.
#
# Nothing is lost by disabling it. It exists to switch Frame mic filters on
# and off, and this device has no capture path at all.
#
# Higher number than 40- and 70-, same directory, so these entries win.
wireplumber.profiles = {
  main = {
    "steamos.spatial-node-config" = "disabled"
    "steamos.microphone-tracker" = "disabled"
  }
}
