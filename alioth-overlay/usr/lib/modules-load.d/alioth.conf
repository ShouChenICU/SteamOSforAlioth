# Xiaomi alioth (Redmi K40 / POCO F3): modules systemd loads at boot.
#
# Everything here is =m and every one of them *should* be auto-loaded from
# a modalias. They are listed anyway because this port has been bitten
# three times by a driver that was =m and therefore simply absent, and in
# each case the symptom pointed somewhere else entirely. Listing a module
# that udev would have loaded anyway costs nothing.

# PCIe. Measured in phase 1: without this one 9.7 KB module there is no
# PCIe bus at all -- 1c00000.pcie sits in devices_deferred, the QCA6390
# never enumerates, and WiFi and Bluetooth disappear together. It looks
# exactly like dead hardware. Nothing else depends on it (it is a hidden
# tristate whose value just tracks ATH11K_PCI), so if the QCA6390 is
# missing from the bus, look here first.
pci-pwrctrl-pwrseq

# WiFi: QCA6390 over PCIe (17cb:1101), ath11k + MHI. Pulls in ath11k,
# mhi and qmi_helpers through modules.dep.
ath11k_pci

# Bluetooth: QCA6390 over &uart6 as a serdev, hci_uart with the QCA
# backend (BT_HCIUART_QCA is =y inside hci_uart) plus btqca for the
# firmware download (qca/htbtfw20.tlv).
bluetooth
hci_uart
btqca

# Audio: the qcom,sm8250-sndcard machine driver, and the two CS35L41
# speaker amps that are its only codec. Without the amp driver the DAI
# link never completes and the card does not register at all -- see the
# CS35L41 note in kernel-sm8250/steamos.config.
snd-soc-sm8250
snd-soc-cs35l41-i2c
