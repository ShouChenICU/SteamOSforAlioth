# Xiaomi alioth (Redmi K40 / POCO F3): speakers only.
#
# There is no 3.5 mm jack on this phone and no analog codec in the device
# tree (no WCD938x, no WSA881x), so unlike the handhelds there is exactly
# one output and no capture path. Headphones are Bluetooth, which does not
# go through ALSA at all.
#
# One PCM: the device tree declares a single q6asmdai (dai@0) =
# MultiMedia1, routed to TERTIARY_TDM_RX_0, which feeds both CS35L41 amps
# (sound-name-prefix RCV and LCV).
#
# TDM, not MI2S. The amps' ASP_SDIN is on mi2s2_data1 (gpio137), which only
# the tertiary TDM pin group drives; tertiary MI2S with sd-lines = <0> drives
# mi2s2_data0 (gpio134), the line the amps send their VI sense back on. An
# MI2S backend therefore produces a card that passes every check and makes no
# sound -- see the comment on &q6afedai in sm8250-xiaomi-alioth.dts. TDM needs
# patches 0026 and 0027 to reach the ADSP with usable framing.

SectionVerb {
	EnableSequence [
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 1"

		# 数字衰减。原来放在 Alioth.conf 的 BootSequence 里，**那段
		# 从来没有执行过** —— BootSequence 要 alsactl init / alsaucm
		# boot 去跑，这台机器上没人跑它，重启后读回来是 817（芯片复位
		# 默认 0 dB），不是写的 721。SectionVerb.EnableSequence 是
		# PipeWire 的 ACP 确实会执行的那一段，所以增益全部放这里。
		#
		# 721 = −12 dB。Digital PCM Volume 是 SOC_SINGLE_SX_TLV，
		# 1..913 线性对应 −102.00 .. +12.00 dB，步长 0.125 dB（0 是
		# 静音），所以 −12 dB = 1 + (102 − 12) / 0.125 = 721。
		cset "name='RCV Digital PCM Volume' 721"
		cset "name='LCV Digital PCM Volume' 721"

		# 功放的 D 类模拟级。第 0 档带 TLV mute 标志，而芯片就是从第 0
		# 档起来的 —— 不显式设它，上游一切正常也照样一点声音都没有。
		#
		# 两颗不同增益，这是硬件决定的：RCV 驱动的是听筒（机身上方），
		# 振膜和音圈比底部主扬声器小一个量级。同增益把它烧过一次，详见
		# Alioth.conf 里的说明和 docs/alioth.md 的事故记录。
		cset "name='RCV Analog PCM Volume' 4"
		cset "name='LCV Analog PCM Volume' 10"

		# Dynamic range enhancement, and a 4 ms ramp on volume changes
		# so they do not click.
		cset "name='RCV DRE Switch' 1"
		cset "name='LCV DRE Switch' 1"
		cset "name='RCV PCM Soft Ramp' 4ms"
		cset "name='LCV PCM Soft Ramp' 4ms"
	]

	DisableSequence [
		cset "name='RCV Digital PCM Volume' 721"
		cset "name='LCV Digital PCM Volume' 721"
		cset "name='RCV Analog PCM Volume' 0"
		cset "name='LCV Analog PCM Volume' 0"
		cset "name='RCV DRE Switch' 0"
		cset "name='LCV DRE Switch' 0"
		cset "name='RCV PCM Soft Ramp' Off"
		cset "name='LCV PCM Soft Ramp' Off"
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	# ASP, not DSP. The amps can route ASP_RX1 through their own DSP1 for
	# Cirrus speaker protection, and the mainline configuration for this
	# board does exactly that -- but only because it ships the Cirrus
	# wmfw/bin pair. We have no redistributable copy of those, and with
	# DSP1 unloaded a PCM Source of DSP reads a DSP that is not running,
	# which is silence. The bypass path is what cs35l41 uses on every
	# laptop that lacks the firmware too.
	EnableSequence [
		cset "name='RCV PCM Source' ASP"
		cset "name='LCV PCM Source' ASP"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}
