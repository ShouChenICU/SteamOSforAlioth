# Use case configuration for Xiaomi alioth (Redmi K40 / POCO F3, SM8250)
#
# The file name is the *sound card* name, which the qcom machine driver
# takes from the &sound node's model property -- "xiaomi-alioth" -- not
# from the board model ("Xiaomi Poco F3"). Same split as the AYANEO
# Pocket MICRO 2, whose board is "AYANEO Pocket MICRO 2" and whose UCM is
# PocketMICRO2.conf. Get this wrong and ALSA silently finds no UCM:
# the card exists and there is no sound. scripts/assert-alioth-modules.py
# reads the model straight out of the DTS so the two cannot drift.

Syntax 4

SectionUseCase."HiFi" {
	File "/Xiaomi/Alioth/HiFi.conf"
	Comment "Speakers"
}

# Both amps are pinned to a fixed, conservative level and left there; the
# user's volume is done in software by PipeWire. Two reasons: there is no
# single hardware control that covers both amps (they are separate codecs,
# prefixed RCV and LCV, so a PlaybackMixerElem could only ever move one of
# them), and nasaarmas/pmaports-alioth reports these speakers sound bad
# when driven hard.
#
# 721 is -12 dB. CS35L41 "Digital PCM Volume" is SOC_SINGLE_SX_TLV over
# 1..913 mapping linearly to -102.00 .. +12.00 dB in 0.125 dB steps
# (0 is mute), so -12 dB = 1 + (102 - 12) / 0.125 = 721.
BootSequence [
	cset "name='RCV Digital PCM Volume' 721"
	cset "name='LCV Digital PCM Volume' 721"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
