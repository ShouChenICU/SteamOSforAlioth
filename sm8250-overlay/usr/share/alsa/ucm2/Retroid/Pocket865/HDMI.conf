# DisplayPort (USB-C) audio for the Retroid Pocket 865 models: MultiMedia4,
# the fourth PCM.

SectionVerb {
	EnableSequence [
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia4' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia4' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."HDMI" {
	Comment "DisplayPort / HDMI"

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},3"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "DP0 Jack"
	}
}
