# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# MANGMI Pocket Max (SM8250). The rumble motor is the generic pwm-vibrator,
# which the Air Y Pro has too, hence the model gate on both.
version: 1
kind: CompositeDevice
name: MANGMI Pocket Max

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: MANGMI Pocket Max

single_source: false

source_devices:
  - group: gamepad
    evdev:
      name: MANGMI Pocket Max Joypad
      phys_path: mangmi-pocket-max/input0
      handler: event*
    capability_map_id: mangmi_pocket_max_865
  - group: gamepad
    evdev:
      name: pwm-vibrator
      handler: event*

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - keyboard
