# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
# MANGMI Pocket Max (SM8250): SPI joypad MCU. Face buttons as labelled,
# analog triggers on ABS_HAT2X / ABS_HAT2Y, back paddles on
# BTN_TRIGGER_HAPPY1/2, the Back key opens Steam's Quick Access menu.
version: 2
kind: CapabilityMap
name: MANGMI Pocket Max Mapping
id: mangmi_pocket_max_865

mapping:
  - name: Guide
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_MODE
          value_type: button
    target_event:
      gamepad:
        button: Guide

  - name: South Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_SOUTH
          value_type: button
    target_event:
      gamepad:
        button: South

  - name: East Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_EAST
          value_type: button
    target_event:
      gamepad:
        button: East

  - name: West Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_WEST
          value_type: button
    target_event:
      gamepad:
        button: West

  - name: North Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_NORTH
          value_type: button
    target_event:
      gamepad:
        button: North

  - name: Start
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_START
          value_type: button
    target_event:
      gamepad:
        button: Start

  - name: Select
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_SELECT
          value_type: button
    target_event:
      gamepad:
        button: Select

  - name: Quick Access
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_BACK
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess

  - name: Left Bumper
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TL
          value_type: button
    target_event:
      gamepad:
        button: LeftBumper

  - name: Right Bumper
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TR
          value_type: button
    target_event:
      gamepad:
        button: RightBumper

  - name: Left Trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT2X
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: LeftTrigger

  - name: Right Trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT2Y
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: RightTrigger

  - name: LeftPaddle1
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY1
          value_type: button
    target_event:
      gamepad:
        button: LeftPaddle1

  - name: RightPaddle1
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY2
          value_type: button
    target_event:
      gamepad:
        button: RightPaddle1

  - name: Left Stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_X
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_Y
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: LeftStick

  - name: Right Stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_RX
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_RY
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: RightStick

  - name: Left Stick Click
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_THUMBL
          value_type: button
    target_event:
      gamepad:
        button: LeftStick

  - name: Right Stick Click
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_THUMBR
          value_type: button
    target_event:
      gamepad:
        button: RightStick

  - name: DPadUp
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0Y
          value_type: button
          axis_direction: negative
    target_event:
      gamepad:
        button: DPadUp

  - name: DPadDown
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0Y
          value_type: button
          axis_direction: positive
    target_event:
      gamepad:
        button: DPadDown

  - name: DPadLeft
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0X
          value_type: button
          axis_direction: negative
    target_event:
      gamepad:
        button: DPadLeft

  - name: DPadRight
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0X
          value_type: button
          axis_direction: positive
    target_event:
      gamepad:
        button: DPadRight

filtered_events: []
