# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
# AYANEO Pocket MICRO 2 (SM8250): the same AYANEO DirectInput pad as the
# Pocket FIT / S2 (4001:0428, konkr_pocketfit_dinput), but its face buttons
# report the codes of the opposite positions (A comes in as BTN_EAST, X as
# BTN_NORTH), and its two back buttons are L4 / R4.
version: 2
kind: CapabilityMap
name: AYANEO Pocket MICRO 2 (Steam Deck layout)
id: ayaneo_pocketmicro2

mapping:
  - name: Steam
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_MODE, value_type: button}
    target_event:
      gamepad: {button: Guide}
  - name: A
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_EAST, value_type: button}
    target_event:
      gamepad: {button: South}
  - name: B
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_SOUTH, value_type: button}
    target_event:
      gamepad: {button: East}
  - name: X
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_NORTH, value_type: button}
    target_event:
      gamepad: {button: West}
  - name: Y
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_WEST, value_type: button}
    target_event:
      gamepad: {button: North}
  - name: Start
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_START, value_type: button}
    target_event:
      gamepad: {button: Start}
  - name: Select
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_SELECT, value_type: button}
    target_event:
      gamepad: {button: Select}
  - name: L1
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_TL, value_type: button}
    target_event:
      gamepad: {button: LeftBumper}
  - name: R1
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_TR, value_type: button}
    target_event:
      gamepad: {button: RightBumper}
  - name: L2
    source_events:
      - evdev: {event_type: ABS, event_code: ABS_BRAKE, value_type: trigger}
    target_event:
      gamepad: {trigger: {name: LeftTrigger}}
  - name: R2
    source_events:
      - evdev: {event_type: ABS, event_code: ABS_GAS, value_type: trigger}
    target_event:
      gamepad: {trigger: {name: RightTrigger}}
  - name: L5 (LC1, lower back left)
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_Z, value_type: button}
    target_event:
      gamepad: {button: LeftPaddle1}
  - name: R5 (RC1, lower back right)
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_C, value_type: button}
    target_event:
      gamepad: {button: RightPaddle1}
  - name: Left Stick
    source_events:
      - evdev: {event_type: ABS, event_code: ABS_X, value_type: joystick_x}
      - evdev: {event_type: ABS, event_code: ABS_Y, value_type: joystick_y}
    target_event:
      gamepad: {axis: {name: LeftStick}}
  - name: Right Stick
    source_events:
      - evdev: {event_type: ABS, event_code: ABS_Z, value_type: joystick_x}
      - evdev: {event_type: ABS, event_code: ABS_RZ, value_type: joystick_y}
    target_event:
      gamepad: {axis: {name: RightStick}}
  - name: L3
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_THUMBL, value_type: button}
    target_event:
      gamepad: {button: LeftStick}
  - name: R3
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_THUMBR, value_type: button}
    target_event:
      gamepad: {button: RightStick}
  - name: Dpad Left
    source_events:
      - evdev: {event_type: ABS, event_code: ABS_HAT0X, value_type: button, axis_direction: negative}
    target_event:
      gamepad: {button: DPadLeft}
  - name: Dpad Right
    source_events:
      - evdev: {event_type: ABS, event_code: ABS_HAT0X, value_type: button, axis_direction: positive}
    target_event:
      gamepad: {button: DPadRight}
  - name: Dpad Up
    source_events:
      - evdev: {event_type: ABS, event_code: ABS_HAT0Y, value_type: button, axis_direction: negative}
    target_event:
      gamepad: {button: DPadUp}
  - name: Dpad Down
    source_events:
      - evdev: {event_type: ABS, event_code: ABS_HAT0Y, value_type: button, axis_direction: positive}
    target_event:
      gamepad: {button: DPadDown}

filtered_events: []
